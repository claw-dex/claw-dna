[project]
name = "agent"
version = "1.0.0"
description = "Claw DNA - Python dependencies"
requires-python = ">=3.11"
# ── Dependencies ─────────────────────────────────────────────
# The agent can add packages here and run `uv sync` to install.
# Streamlit serves the portal with built-in hot-reload (runOnSave=true).
dependencies = [
    "streamlit",
    "streamlit-autorefresh",
    "hydralit-components",
    "numpy<2.0",
    "plotly",
    "claude-agent-sdk",
    "pykeepass",
    "psutil",
    "memvid-sdk-free==2.0.159",
    "ripgrep-rs==0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["services", "scripts", "."]
addopts = "-ra"
