[project]
name = "agent"
version = "1.0.0"
description = "Claw DNA - Python dependencies"
requires-python = ">=3.11"
# ── Dependencies ─────────────────────────────────────────────
# The agent can add packages here and run `uv sync` to install.
# Streamlit serves the portal with built-in hot-reload (runOnSave=true).
dependencies = [
    "streamlit",
    "streamlit-autorefresh",
    "streamlit-chunk-file-uploader",
    "hydralit-components",
    "numpy<2.0",
    "plotly",
    "claude-agent-sdk",
    "pykeepass",
    "psutil",
    "duckdb>=1.1",
    "lancedb>=0.36",
    "fastembed>=0.8",
    "bm25s==0.3.8",
    "slack-bolt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Resolve only for the container runtime: Linux, Python 3.11. Widening this
# forces uv to also solve for 3.12+, where fastembed requires numpy>=2.1 and
# conflicts with the numpy<2.0 pin above.
environments = ["sys_platform == 'linux' and python_full_version < '3.12'"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
    "slack-bolt",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["services", "scripts", "."]
addopts = "-ra"
